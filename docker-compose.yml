services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ivr_voice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ─── Backend Services ──────────────────────────────────────────────────────

  web:
    build:
      context: ./services/django
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/django:/app
      - ./voice_assets:/app/voice_assets
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  fastapi:
    build:
      context: ./services/fastapi
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/fastapi:/app
    ports:
      - "8001:8001"
    depends_on:
      - web
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  worker:
    build:
      context: ./services/tts_worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/tts_worker:/app
      - ./voice_assets:/app/voice_assets
      - ./config:/app/config
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - db
    command: celery -A tasks worker --loglevel=info --concurrency=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  beat:
    build:
      context: ./services/django
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/django:/app
    depends_on:
      - redis
      - db
    command: celery -A core beat --loglevel=info

  # Runs Django-side Celery tasks (daily credit reset). Listens only on the
  # "django" queue so GPU generation jobs never land here and vice versa.
  django_worker:
    build:
      context: ./services/django
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/django:/app
    depends_on:
      - redis
      - db
    command: celery -A core worker -Q django --loglevel=info --concurrency=1

  # ─── Frontend ──────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host

# ─── Volumes ───────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  minio_data:
  hf_cache: